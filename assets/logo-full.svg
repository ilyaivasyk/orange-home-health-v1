<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 112" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Orange Home Health Inc.</title>
  <desc id="logo-desc">An orange house and heart surround a blue caregiver and orange child beside the Orange Home Health Inc. wordmark.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6A13A"/>
      <stop offset="0.5" stop-color="#E9781B"/>
      <stop offset="1" stop-color="#B94716"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55B9E8"/>
      <stop offset="1" stop-color="#17648B"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#18354A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(5 4)" filter="url(#soft-shadow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 40 48 4l25 20V13h12v21l14 12" fill="none" stroke="url(#orange)" stroke-width="6"/>
    <path d="M13 36v51M88 37v50" fill="none" stroke="url(#orange)" stroke-width="6"/>
    <path d="M50 85S25 69 25 48c0-19 21-23 25-7 5-16 27-12 27 7 0 20-27 37-27 37Z" fill="none" stroke="url(#orange)" stroke-width="5"/>
    <circle cx="43" cy="48" r="7" fill="url(#blue)"/>
    <path d="M34 58c-5 5-3 17 3 23 7 8 17 11 26 8 4-1 5-6 1-8-11 1-17-4-21-13l1 9c1 5-5 7-7 2-4-9-6-17-3-21Z" fill="url(#blue)"/>
    <circle cx="64" cy="62" r="5.5" fill="url(#orange)"/>
    <path d="M58 70c6 0 10-2 13-5 4-2 7 2 5 6-4 7-11 11-20 12-5 0-6-4-3-7 1-3 3-5 5-6Z" fill="url(#orange)"/>
    <path d="M9 97c16-10 31-9 43-3M55 94c13-6 28-5 43 5" fill="none" stroke="url(#blue)" stroke-width="5"/>
  </g>

  <g transform="translate(120 0)">
    <text x="0" y="50" fill="url(#orange)" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="700" letter-spacing="-1.6">Orange</text>
    <text x="3" y="74" fill="#17648B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">HOME HEALTH INC.</text>
    <path d="M3 91h27M263 91h27" fill="none" stroke="#E9781B" stroke-width="2.5" stroke-linecap="round"/>
    <text x="145" y="96" text-anchor="middle" fill="#42677D" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic">Caring for You at Home</text>
  </g>
</svg>
